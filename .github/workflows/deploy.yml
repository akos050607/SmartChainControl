name: Deploy SmartChainControl

on:
  push:
    branches:
      - main 

jobs:
  deploy:
    name: Deploy to Hetzner VPS
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Csatlakozás a szerverhez és frissítés
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          
          script: |
            echo "1. Ugrás a projekt mappájába (abszolút útvonalon)..."
            cd /opt/websites/SmartChainControl
            
            echo "2. Legfrissebb kód letöltése a GitHubról..."
            git pull origin main
            
            echo "3. Blazor konténer újraépítése (Cache nélkül)..."
            docker compose build --no-cache
            
            echo "4. Új konténer elindítása a háttérben..."
            docker compose up -d
            
            echo "5. Szemét eltakarítása (Régi Docker image-ek törlése)..."
            docker system prune -f
            
            echo "✅ Frissítés sikeresen befejeződött!"