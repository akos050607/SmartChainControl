<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartChainControl.Client</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="SmartChainControl.Client.styles.css" rel="stylesheet" />
    <style>
    /* A te eredeti háttered (ez marad a body-n) */
    html, body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        /* Sima fekete helyett egy modern, mélykék radiális átmenet */
        background: radial-gradient(circle at 50% 50%, #1a2235 0%, #030406 100%) !important;
    }

    /* ÚJ: A betöltőképernyő hátterének kilövése (EZ A KULCS!) */
    #app, #app > div {
        background: transparent !important;
        background-color: transparent !important;
        box-shadow: none !important;
    }

    /* ÚJ: A 'Loading...' felirat és ikon stílusa, hogy látszódjon a sötétkék hátteren */
    .loading-progress-text {
        color: #00ffff !important; /* Világító kék */
        font-family: 'Segoe UI', 'Roboto', monospace;
        font-size: 1.2rem;
        letter-spacing: 2px;
        text-shadow: 0 0 10px #00ffff;
    }
</style>
</head>

<body>
    <div id="app">
        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center;">
            <div style="font-size: 2.5rem; font-weight: bold; color: #fff; letter-spacing: 4px; margin-bottom: 15px;">
                <span style="color: #00ffff;">SMART</span>
            </div>
            <div style="color: #00ffff; font-family: 'Segoe UI', monospace; font-size: 1.2rem; letter-spacing: 5px; text-shadow: 0 0 10px #00ffff; animation: pulse 1.5s infinite;">
                RENDSZER INDÍTÁSA...
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>

    <script src="js/renderEngine.js?v=4.0"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
